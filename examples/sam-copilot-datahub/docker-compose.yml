services:
  sam-copilot-postgres:
    image: postgres:16-alpine
    container_name: sam-copilot-postgres
    environment:
      POSTGRES_DB: sam_copilot
      POSTGRES_USER: sam_demo
      POSTGRES_PASSWORD: sam_demo
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sam_demo -d sam_copilot"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ./data:/demo-data:ro
      - ./sql:/docker-entrypoint-initdb.d:ro
